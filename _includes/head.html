<!-- _includes/head.html -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<!-- SEO -->
<title>
  {%- if page.title -%} {{ page.title }} | {{ site.title }} {%- else -%} {{
  site.title }} {%- endif -%}
</title>
<meta
  name="description"
  content="{{ page.description | default: site.description | strip_html | truncate: 160 }}"
/>
<meta name="author" content="{{ site.author }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- Open Graph -->
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta
  property="og:description"
  content="{{ page.description | default: site.description }}"
/>
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:type" content="website" />

<!-- Google Fonts: DM Serif Display + DM Sans + JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

<!-- Favicon (replace with your own) -->
<link
  rel="icon"
  type="image/svg+xml"
  href="{{ '/assets/images/logo.svg' | relative_url }}"
/>

{% seo %}
